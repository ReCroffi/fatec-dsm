<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil</title>
    <link rel="stylesheet" href="./main.css" />
    <script src="./main.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Perfil</h1>
    </header>

    <form id="perfil" method="get" onsubmit="return validarPerfil();">
      <input type="hidden" name="origem" value="perfil" />

      <div class="form_input">
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" />
      </div>

      <div class="form_input">
        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" />
      </div>

      <div class="form_input">
        <span>Sexo:</span>
        <label><input type="radio" name="sexo" value="feminino" /> Feminino</label>
        <label><input type="radio" name="sexo" value="masculino" /> Masculino</label>
        <label><input type="radio" name="sexo" value="outro" /> Outro</label>
      </div>

      <div class="form_input">
        <span>Interesses:</span>
        <label><input type="checkbox" name="interesses" value="html" /> HTML</label>
        <label><input type="checkbox" name="interesses" value="css" /> CSS</label>
        <label><input type="checkbox" name="interesses" value="javascript" /> JavaScript</label>
      </div>

      <div class="form_input">
        <label for="curso">Curso:</label>
        <select id="curso" name="curso">
          <option value="">Selecione...</option>
          <option value="dsm">Desenvolvimento de Software Multiplataforma</option>
          <option value="gti">Gestão da Tecnologia da Informação</option>
          <option value="outro">Outro</option>
        </select>
      </div>

      <div class="form_input">
        <label for="sobre">Sobre você:</label>
        <textarea id="sobre" name="sobre" rows="4"></textarea>
      </div>

      <div class="button">
        <button type="submit">Salvar</button>
      </div>

      <nav>
        <a class="links" href="cadastro.html">Cadastre-se</a>
        <a class="links" href="#">Esqueci minha senha</a>
      </nav>
    </form>
  </body>
</html>
