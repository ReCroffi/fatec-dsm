<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro</title>
    <link rel="stylesheet" href="./main.css" />
    <script src="./main.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Cadastro</h1>
    </header>

    <form id="cadastro" method="get" onsubmit="return validarCadastro();">
      <input type="hidden" name="origem" value="cadastro" />

      <div class="form_input">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" />
      </div>

      <div class="form_input">
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" />
      </div>

      <div class="form_input">
        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" />
      </div>

      <div class="form_input">
        <label for="confirma">Confirmar senha:</label>
        <input type="password" id="confirma" name="confirma" />
      </div>

      <div class="form_input">
        <label><input type="checkbox" name="termos" /> Aceito os termos de uso</label>
      </div>

      <div class="button">
        <button type="submit">Cadastrar</button>
      </div>

      <nav>
        <a class="links" href="perfil.html">Já tenho conta</a>
        <a class="links" href="#">Esqueci minha senha</a>
      </nav>
    </form>
  </body>
</html>
